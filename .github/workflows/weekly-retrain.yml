name: weekly-retrain

# Retrains the forecasting model on all data and commits models/latest.joblib and
# reference.csv. Runs Monday 12:47 Lagos time, after both daily attempts, so Monday's
# forecast still comes from the previous model and the new one takes over on Tuesday.
# Every forecast records model_trained_through, so each model version can be told apart.
on:
  schedule:
    - cron: "47 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Shares a group with daily-forecast so the two never run or push at the same time
concurrency:
  group: pm25-pipeline
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest full history
        run: |
          mkdir -p data
          python src/ingest.py

      - name: Retrain
        run: python src/train.py | tee train_summary.json

      - name: Commit model and reference if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/latest.joblib reference.csv
          if git diff --cached --quiet; then
            echo "Model and reference unchanged"
          else
            git commit -m "Weekly retrain $(TZ=Africa/Lagos date +%F)" -m "$(cat train_summary.json)"
            git pull --rebase origin main
            git push
          fi
